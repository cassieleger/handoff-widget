<!doctype html>
  <html lang="en">
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shift Ledger &amp; GPM — Jotform widget</title>
<script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Work+Sans:wght@400;500;600&display=swap">
  <style>
  /* Single light theme on purpose: this renders inside a Jotform page. */
  :root{
    --surface:#FFFFFF; --surface-2:#EFE9E0; --sunken:#F7F3ED;
    --ink:#122834; --ink-2:#414651; --ink-3:#79716B;
  --line:#E3DBD0; --line-2:#D3C9BB;
      --accent:#4A7272; --accent-soft:#E4EBE8;
      --gold:#B07C23; --gold-soft:#F8EEDC;
      --red:#96382F; --red-soft:#F4E1DD;
    }
*{box-sizing:border-box}
html,body{margin:0}
  body{background:var(--surface); color:var(--ink-2);
  font-family:"Work Sans", ui-sans-serif, system-ui, sans-serif; font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; padding:2px}
.num{font-variant-numeric:tabular-nums lining-nums}
label,.lbl{font-size:10px; font-weight:600; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}
input,select{font-family:inherit; font-size:14.5px; color:var(--ink); background:var(--surface);
  border:1px solid var(--line-2); border-radius:4px; padding:8px 10px; width:100%; min-width:0}
input[type="number"]{font-variant-numeric:tabular-nums}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
select{appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 16px) calc(50% + 1px), calc(100% - 11px) calc(50% + 1px);
  background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:30px}

/* readout */
.readout{display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line);
  border-top:3px solid var(--accent); border-radius:4px; overflow:hidden; margin-bottom:14px}
.hero{padding:16px 18px; background:var(--accent-soft)}
.hero .lbl{color:var(--accent)}
.hero-v{font-family:"Playfair Display",Georgia,serif; font-size:42px; font-weight:600; line-height:1;
  color:var(--ink); margin-top:8px; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.hero-v span{font-family:"Work Sans",sans-serif; font-size:.35em; color:var(--ink-3); margin-left:3px}
.counts{display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--line)}
.count{padding:14px 16px; border-left:1px solid var(--line)}
.count-v{font-size:22px; font-weight:600; color:var(--ink); margin-top:3px; font-variant-numeric:tabular-nums}

/* shift lines */
.line{border:1px solid var(--line); border-radius:4px; overflow:hidden; margin-bottom:10px; background:var(--surface)}
.line-id{display:grid; grid-template-columns:1fr 1.2fr 1.2fr 130px 34px; gap:9px; padding:11px 12px; align-items:end}
.line-fields{display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:9px; padding:0 12px 12px}
.field{display:flex; flex-direction:column; gap:4px; min-width:0}
.line-out{display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--accent-soft); border-top:1px solid var(--line); padding:9px 12px}
.line-out .lbl{color:var(--accent)}
.line-out .v{font-size:18px; font-weight:600; color:var(--accent); font-variant-numeric:tabular-nums}
.del{background:transparent; border:1px solid var(--line-2); color:var(--ink-3); border-radius:4px;
  height:36px; width:34px; cursor:pointer; font-size:16px; line-height:1; font-family:inherit}
.del:hover{border-color:var(--red); color:var(--red); background:var(--red-soft)}
.add{width:100%; background:transparent; border:1px dashed var(--line-2); color:var(--ink-2);
  border-radius:4px; padding:10px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit}
.add:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}

    @media (max-width:620px){
  .line-id{grid-template-columns:1fr 34px}
      .line-id .f-shift,.line-id .f-cg,.line-id .f-disc{grid-column:1 / 2}
      .count{border-left:none; border-top:1px solid var(--line)}
}
</style>
  </head>
  <body>

  <div class="readout">
    <div class="hero">
      <div class="lbl">Personal daily GPM %</div>
      <div class="hero-v num" id="gpm">&mdash;<span>%</span></div>
    </div>
    <div class="counts">
      <div class="count"><div class="lbl">CG/IC/PT shifts</div><div class="count-v num" id="cg">0</div></div>
      <div class="count"><div class="lbl">LVN/RN shifts</div><div class="count-v num" id="lvn">0</div></div>
    </div>
  </div>

  <div id="lines"></div>
  <button type="button" class="add" id="add">+ Add shift</button>

  <script>
  (function(){
  "use strict";
var DISC = ["CG","IC","PT","LVN","RN"], CLINICAL = {LVN:1, RN:1};
var lines = [], outs = {};
var $ = function(id){ return document.getElementById(id); };
function uid(){ return Math.random().toString(36).slice(2,9); }
function n(v){ var x = parseFloat(v); return isFinite(x) ? x : 0; }
function pct(v){ return v.toFixed(1) + "%"; }
function money(v){ return "$" + v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }

var OT1_MULT = 1.5, OT2_MULT = 2;
/* Regular Overtime Rule: 0-9h normal, anything past 9h at 1.5x.
   Facility Overtime Rule: 0-8h normal, 8-12h at 1.5x, anything past 12h at 2x. */
function splitHours(total, rule){
    total = Math.max(0, total);
  if(rule === "facility"){
        var reg = Math.min(total, 8);
    var ot1 = Math.min(Math.max(total - 8, 0), 4);
    var ot2 = Math.max(total - 12, 0);
    return { reg:reg, ot1:ot1, ot2:ot2 };
  }
  var reg2 = Math.min(total, 9);
  var ot1b = Math.max(total - 9, 0);
  return { reg:reg2, ot1:ot1b, ot2:0 };
}
/* Bill rate is flat for every hour worked (the client isn't billed an OT
   premium); only the employee's pay gets the tiered OT/double-time multiplier. */
function compute(L){
    var pay = n(L.pay), bill = n(L.bill);
  var h = splitHours(n(L.hours), L.otRule);
  var totalHrs = h.reg + h.ot1 + h.ot2;
  var revenue = totalHrs*bill;
  var labor   = h.reg*pay  + h.ot1*pay *OT1_MULT + h.ot2*pay *OT2_MULT;
  return { revenue:revenue, labor:labor, gp:revenue-labor,
               gpm: revenue>0 ? (revenue-labor)/revenue*100 : 0,
               counted: revenue>0 || labor>0, hours:h };
}
function blank(){ return {id:uid(), shiftTime:"", client:"", cg:"", disc:"CG", hours:"", otRule:"regular", bill:"", pay:""}; }

function node(L){
    var d = document.createElement("div");
  d.className = "line";
  d.innerHTML =
        '<div class="line-id">'+
          '<div class="field f-shift"><label>Shift Date/Time</label><input type="text" data-k="shiftTime" placeholder="e.g. 3/12 7a-3p"></div>'+
          '<div class="field f-client"><label>Client Name</label><input type="text" data-k="client" placeholder="First name Last name"></div>'+
          '<div class="field f-cg"><label>Employee Staffed</label><input type="text" data-k="cg" placeholder="Name"></div>'+
          '<div class="field f-disc"><label>Employee Type</label><select data-k="disc">'+
            DISC.map(function(o){ return '<option>'+o+'</option>'; }).join("")+'</select></div>'+
          '<button type="button" class="del" aria-label="Remove shift">&times;</button>'+
        '</div>'+
        '<div class="line-fields">'+
          '<div class="field"><label>Total hrs</label><input type="number" step="0.25" min="0" inputmode="decimal" data-k="hours" placeholder="0"></div>'+
          '<div class="field"><label>OT Rule</label><select data-k="otRule">'+
            '<option value="regular">Regular Overtime Rule</option>'+
            '<option value="facility">Facility Overtime Rule</option>'+
          '</select></div>'+
          '<div class="field"><label>Bill $/hr</label><input type="number" step="0.01" min="0" inputmode="decimal" data-k="bill" placeholder="0.00"></div>'+
          '<div class="field"><label>Pay $/hr</label><input type="number" step="0.01" min="0" inputmode="decimal" data-k="pay" placeholder="0.00"></div>'+
        '</div>'+
        '<div class="line-out"><span class="lbl">GPM for this shift</span><span class="v" data-o="gpm">&mdash;</span></div>';

  d.querySelectorAll("[data-k]").forEach(function(inp){
        var k = inp.getAttribute("data-k");
    inp.id = "f-"+L.id+"-"+k;
    inp.value = L[k] == null ? "" : L[k];
    var h = function(){ L[k] = inp.value; recalc(); };
    inp.addEventListener("input", h); inp.addEventListener("change", h);
  });
  d.querySelector(".del").addEventListener("click", function(){
        lines = lines.filter(function(x){ return x.id !== L.id; });
    if(!lines.length) lines.push(blank());
    render();
  });
  outs[L.id] = d.querySelector('[data-o="gpm"]');
  return d;
}

function render(){
    var host = $("lines"); host.textContent = ""; outs = {};
  lines.forEach(function(L){ host.appendChild(node(L)); });
  recalc();
  }

function totals(){
    var rev=0, lab=0, cnt=0, cg=0, clin=0;
  lines.forEach(function(L){
        var c = compute(L);
    rev+=c.revenue; lab+=c.labor;
    if(c.counted){
      if(c.revenue>0) cnt++;
      if(CLINICAL[L.disc]) clin++; else cg++;
    }
  });
  return { rev:rev, lab:lab, gp:rev-lab, blended: rev>0 ? (rev-lab)/rev*100 : null,
               count:cnt, cg:cg, clin:clin };
}

function submittedValue(t){
    if(!t.count) return "";
  var out = [];
  out.push("Personal daily GPM: " + pct(t.blended) + " blended");
  out.push("CG/IC/PT shifts staffed: " + t.cg + "   LVN/RN shifts staffed: " + t.clin);
  out.push("");
  out.push("SHIFT(S) STAFFED");
  lines.forEach(function(L){
        var c = compute(L);
    if(!c.counted) return;
    var otBits = [];
    if(c.hours.ot1) otBits.push(c.hours.ot1 + "h @1.5x");
    if(c.hours.ot2) otBits.push(c.hours.ot2 + "h @2x");
    var hoursText = n(L.hours) + "h" + (otBits.length ? " (" + otBits.join(", ") + " OT)" : "");
    out.push("• " + (L.shiftTime ? L.shiftTime + " — " : "") + (L.client || "Client") + " — " + (L.cg || "Unassigned") + " (" + L.disc + ")  "
            + hoursText
            + "  bill " + money(n(L.bill))
            + " / pay " + money(n(L.pay))
            + "  →  GPM " + (c.revenue > 0 ? pct(c.gpm) : "—"));
  });
  return out.join("\n");
}

var lastValue = "";
function recalc(){
    var t = totals();
  lines.forEach(function(L){
        var c = compute(L), o = outs[L.id];
    if(o) o.textContent = c.revenue > 0 ? pct(c.gpm) : "—";
  });
  $("gpm").innerHTML = (t.blended === null ? "—" : t.blended.toFixed(1)) + "<span>%</span>";
  $("cg").textContent = String(t.cg);
  $("lvn").textContent = String(t.clin);

  lastValue = submittedValue(t);
  sync();
}

$("add").addEventListener("click", function(){
    var L = blank();
  lines.push(L);
  $("lines").appendChild(node(L));
  recalc();
  var f = document.getElementById("f-"+L.id+"-client");
  if(f) f.focus();
});

/* ---- Jotform bridge (absent when the file is opened on its own) ---- */
var JF = window.JFCustomWidget;
var lastHeight = 0;
function fit(){
    if(!JF || !JF.requestFrameResize) return;
  var h = Math.ceil(document.body.scrollHeight) + 8;
  if(Math.abs(h - lastHeight) > 4){ lastHeight = h; JF.requestFrameResize({height: h}); }
}
var syncTimer = null;
function sync(){
    fit();
  if(!JF || !JF.sendData) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function(){ JF.sendData({value: lastValue}); }, 250);
}
if(JF){
  JF.subscribe("ready", function(){
        lines = [blank()];
    render();
    fit();
  });
  JF.subscribe("submit", function(){
        var t = totals();
    JF.sendSubmit({ valid: t.count > 0, value: lastValue });
  });
} else {
  lines = [blank()];
  render();
}
window.addEventListener("resize", fit);
})();
</script>
  </body>
  </html>
